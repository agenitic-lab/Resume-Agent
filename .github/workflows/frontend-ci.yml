name: Frontend CI
# Runs lint + build on every PR and push to main that touches frontend/.
# Vercel handles the actual deployment automatically via its GitHub integration.
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run lint
        run: |
          cd frontend
          npm run lint

      - name: Run build
        env:
          # Add any VITE_ build-time env vars your app needs here.
          # Values can be empty strings in CI — the build will still verify
          # the output bundle compiles correctly.
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
        run: |
          cd frontend
          npm run build
