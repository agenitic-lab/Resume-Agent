name: Backend Deploy
# Triggered only when code is merged/pushed directly to main and touches backend/.
# Runs lint + tests first to validate the merged state, then deploys to Render.
# This workflow never runs on pull requests, so no "skipped" check noise on PRs.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
      JWT_SECRET: ci-test-secret
      JWT_SECRET_KEY: ci-test-secret
      ENCRYPTION_KEY: ci-test-encryption-key-not-real

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx flake8

      - name: Run linting
        run: |
          cd backend
          # E9=runtime errors, F63/F7/F82=fatal syntax/undefined-name errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: |
          cd backend
          pytest tests/api/ -v --tb=short

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          if [ -z "$body" ]; then
            echo "Error: Empty response from Render API (HTTP $http_code)"
            exit 1
          fi

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Error: Render API returned HTTP $http_code"
            echo "$body"
            exit 1
          fi

          python3 -c "import sys,json; d=json.loads(sys.argv[1]); print('Deploy triggered:', d.get('id','?'), d.get('status','?'))" "$body"
